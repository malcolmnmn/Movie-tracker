services:
  - type: web
    name: movie-tracker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/data.sqlite
    disk:
      name: movie-tracker-data
      mountPath: /data
      sizeGB: 1
